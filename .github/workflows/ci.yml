name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        # The worker process-view tests drive a real zsh login shell; the
        # hosted Ubuntu image ships without one.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q app scripts tests
      - name: Run the offline regression suite
        run: python tests/run_offline.py
