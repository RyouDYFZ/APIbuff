name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the docker jobs elevate packages: write.
permissions:
  contents: read

# A new push to the same ref supersedes any in-flight run of it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/ryoudyfz/apibuff

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        # The worker process-view tests drive a real zsh login shell; the
        # hosted Ubuntu image ships without one.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q app scripts tests
      - name: Run the offline regression suite
        run: python tests/run_offline.py

  # The official binary now runs unmodified, so repackaging can no longer
  # break its startup. This gate instead vets the pinned release itself in a
  # real pty before deployment: it fails on damaged assets, renderer load
  # errors and blank frames — the historical failure mode this repository
  # hit when CLI builds were still being rebuilt.
  cli-render-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify the pinned official CLI
        run: python3 scripts/fetch_official_cli.py --target linux-x64 --fetch
      - name: Render the first TUI frame under a pty
        run: |
          mkdir -p .freebuff/render-smoke
          cp .freebuff/official-cli/freebuff .freebuff/render-smoke/freebuff
          chmod +x .freebuff/render-smoke/freebuff
          python3 scripts/render_smoke_check.py 25

  # Build one image per architecture on native runners. Stage 1 of the
  # Dockerfile installs the pinned official CLI; no Bun or Node toolchain is
  # involved anymore, and arm64 uses the free native runner public repos
  # get instead of setup-qemu-action.
  docker-build:
    name: docker build (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    needs: offline-tests
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push the single-arch image by digest only; docker-push below
          # ties the per-arch digests into one multi-arch tag.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-push:
    name: docker push (merge manifest)
    if: github.event_name != 'pull_request'
    needs: [offline-tests, docker-build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Version tags (x.y.z) are owned by release.yml, which runs on
          # published GitHub Releases instead of bare tag pushes.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<<"$TAGS"
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect pushed image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
