name: release

# Publishing a GitHub Release (v* tag) is the single switch for a full
# release: regression tests, multi-arch image build, version-tagged GHCR
# push, and the image reference appended to the release notes. ci.yml
# deliberately no longer triggers on bare v* tag pushes, so a release
# never produces two overlapping builds.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/ryoudyfz/apibuff

jobs:
  # Inlined (not a reusable workflow) so releases cut from older tags
  # still pass the gate even if shared workflow files moved since.
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        # The worker process-view tests drive a real zsh login shell; the
        # hosted Ubuntu image ships without one.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q app scripts tests
      - name: Run the offline regression suite
        run: python tests/run_offline.py

  # Same native-runner split as ci.yml: Bun rebuilds in Dockerfile stage 1
  # are too slow/flaky under QEMU, so arm64 builds on its own hardware.
  docker-build:
    name: docker build (${{ matrix.platform }})
    needs: offline-tests
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-push:
    name: docker push (merge manifest)
    needs: [offline-tests, docker-build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Stable releases own the version tags and move `latest`;
          # pre-releases (e.g. 1.1.0-rc1) get their version tags only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha
      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<<"$TAGS"
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect pushed image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release-notes:
    name: attach image reference to release
    needs: [docker-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Append Docker image section to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          notes="$(mktemp)"
          gh release view "$TAG" --repo "$REPO" --json body -q .body >"$notes"
          if grep -q '^### Docker image' "$notes"; then
            echo "Docker image section already present; nothing to do."
            exit 0
          fi
          version="${TAG#v}"
          {
            echo ""
            echo "### Docker image"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:${version}"
            docker buildx imagetools inspect "${IMAGE}:${version}"
            echo '```'
            echo ""
            echo "Multi-arch manifest (linux/amd64, linux/arm64). The \`latest\` tag is moved by stable releases only."
          } >>"$notes"
          gh release edit "$TAG" --repo "$REPO" --notes-file "$notes"
