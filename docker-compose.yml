services:
  freebuff-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: freebuff-api-gateway:latest
    container_name: freebuff-api-gateway
    hostname: standalone-worker-01
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    extra_hosts:
      - "proxy.internal=${FREEBUFF_PROXY_LISTEN_IP:-127.0.0.1}"
    ports:
      - "127.0.0.1:${FREEBUFF_API_PORT:-8000}:8000"
    environment:
      # Upstream Codebuff OAuth Token seeded directly into container
      - CODEBUFF_API_KEY=${CODEBUFF_API_KEY:-}
      - FREEBUFF_USER_EMAIL=${FREEBUFF_USER_EMAIL:-cloud@freebuff.local}
      
      # Gateway Access Protection (Clients pass Authorization: Bearer <FREEBUFF_API_KEY>)
      - FREEBUFF_API_KEY=${FREEBUFF_API_KEY:-}
      
      # Default Model & Execution Tuning
      - FREEBUFF_DEFAULT_MODEL=${FREEBUFF_DEFAULT_MODEL:-glm-5.3-flash}
      - FREEBUFF_JITTER_MODE=${FREEBUFF_JITTER_MODE:-human}
      - FREEBUFF_TURN_TIMEOUT=${FREEBUFF_TURN_TIMEOUT:-120}
      - FREEBUFF_SUPERVISOR_PS_SHIM=${FREEBUFF_SUPERVISOR_PS_SHIM:-true}
      - CODEBUFF_SHIP_LOGS=false
      - FREEBUFF_SANDBOX_DIR=/var/lib/freebuff/accounts
      - FREEBUFF_BIN=${FREEBUFF_BIN:-/opt/freebuff/private-cli/freebuff}
      - FREEBUFF_HARDWARE_PRIVACY=${FREEBUFF_HARDWARE_PRIVACY:-auto}
      - PORT=8000
      
      # Outbound Network Isolation / Multi-Account VPN Proxy
      - FREEBUFF_PROXY_LISTEN_IP=${FREEBUFF_PROXY_LISTEN_IP:-127.0.0.1}
      - FREEBUFF_PROXY_HOST=${FREEBUFF_PROXY_HOST:-proxy.internal}
      - SUBSCRIPTION_URL=${SUBSCRIPTION_URL:-}
      - FREEBUFF_ACCOUNTS_FILE=${FREEBUFF_ACCOUNTS_FILE:-accounts.json}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      # Completely isolated Docker internal volumes (Zero bind mounts to Mac host)
      - freebuff_config:/root/.config/manicode
      - freebuff_accounts:/var/lib/freebuff/accounts
      - freebuff_workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  freebuff_config:
    driver: local
  freebuff_workspace:
    driver: local
  freebuff_accounts:
    driver: local
